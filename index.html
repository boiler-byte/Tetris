<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einfaches Tetris</title>
    <style>
        body {
            background-color: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }
        canvas {
            background-color: #000;
            border: 2px solid #555;
            display: block;
        }
        .info {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .info div {
            background-color: #333;
            padding: 10px 15px;
            border-radius: 5px;
            text-align: center;
        }
        .info span {
            font-weight: bold;
            color: #0f0;
        }
        #nextCanvas {
            background-color: #000;
            border: 2px solid #555;
        }
        button {
            padding: 10px 15px;
            background-color: #0f0;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0c0;
        }
        .controls {
            font-size: 12px;
            color: #aaa;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="300" height="600"></canvas>
        <div class="info">
            <div>Punkte: <span id="score">0</span></div>
            <div>Level: <span id="level">1</span></div>
            <div>Linien: <span id="lines">0</span></div>
            <div>Nächstes:</div>
            <canvas id="nextCanvas" width="120" height="120"></canvas>
            <button id="restartBtn">Neustart</button>
            <div class="controls">
                ← → : Bewegen<br>
                ↑ : Drehen<br>
                ↓ : Schneller fallen<br>
                Leertaste: Sofort fallen
            </div>
        </div>
    </div>

    <script>
        const COLS = 10;
        const ROWS = 20;
        const BLOCK_SIZE = 30;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');

        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const linesElement = document.getElementById('lines');

        // Tetromino-Formen (jede Form ist eine Matrix)
        const SHAPES = [
            // I
            [[1,1,1,1]],
            // O
            [[1,1],
             [1,1]],
            // T
            [[0,1,0],
             [1,1,1]],
            // S
            [[0,1,1],
             [1,1,0]],
            // Z
            [[1,1,0],
             [0,1,1]],
            // J
            [[1,0,0],
             [1,1,1]],
            // L
            [[0,0,1],
             [1,1,1]]
        ];

        const COLORS = [
            '#00f0f0', // I - cyan
            '#f0f000', // O - gelb
            '#a000f0', // T - lila
            '#00f000', // S - grün
            '#f00000', // Z - rot
            '#0000f0', // J - blau
            '#f0a000'  // L - orange
        ];

        let board = [];
        let currentPiece = null;
        let nextPiece = null;
        let score = 0;
        let level = 1;
        let lines = 0;
        let dropCounter = 0;
        let dropInterval = 1000; // ms
        let lastTime = 0;
        let gameOver = false;
        let animationId = null;

        function createBoard() {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    board[r][c] = 0;
                }
            }
        }

        // Erzeugt ein neues Piece-Objekt mit zufälliger Form
        function createPiece() {
            const typeId = Math.floor(Math.random() * SHAPES.length);
            const shape = SHAPES[typeId];
            const color = COLORS[typeId];
            // Startposition: mittig oben
            const x = Math.floor((COLS - shape[0].length) / 2);
            const y = 0;
            return {
                shape: shape.map(row => [...row]), // Kopie
                color: color,
                x: x,
                y: y,
                typeId: typeId
            };
        }

        function rotate(matrix) {
            const N = matrix.length;
            const M = matrix[0].length;
            const rotated = [];
            for (let c = 0; c < M; c++) {
                rotated[c] = [];
                for (let r = N - 1; r >= 0; r--) {
                    rotated[c].push(matrix[r][c]);
                }
            }
            return rotated;
        }

        function collision(piece, offsetX = 0, offsetY = 0, newShape = null) {
            const shape = newShape || piece.shape;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        const boardX = piece.x + c + offsetX;
                        const boardY = piece.y + r + offsetY;
                        if (boardX < 0 || boardX >= COLS || boardY >= ROWS) {
                            return true;
                        }
                        if (boardY >= 0 && board[boardY][boardX]) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function merge(piece) {
            for (let r = 0; r < piece.shape.length; r++) {
                for (let c = 0; c < piece.shape[r].length; c++) {
                    if (piece.shape[r][c]) {
                        const boardY = piece.y + r;
                        const boardX = piece.x + c;
                        if (boardY >= 0 && boardY < ROWS && boardX >= 0 && boardX < COLS) {
                            board[boardY][boardX] = piece.color;
                        }
                    }
                }
            }
        }

        function clearLines() {
            let linesCleared = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(new Array(COLS).fill(0));
                    linesCleared++;
                    r++; // gleiche Zeile erneut prüfen
                }
            }
            if (linesCleared > 0) {
                lines += linesCleared;
                // Punkte: 40, 100, 300, 1200 für 1,2,3,4 Linien (multipliziert mit Level)
                const points = [0, 40, 100, 300, 1200];
                score += (points[linesCleared] || 0) * level;
                // Level alle 10 Linien erhöhen
                const newLevel = Math.floor(lines / 10) + 1;
                if (newLevel > level) {
                    level = newLevel;
                    dropInterval = Math.max(100, 1000 - (level - 1) * 100);
                }
                updateInfo();
            }
        }

        function updateInfo() {
            scoreElement.textContent = score;
            levelElement.textContent = level;
            linesElement.textContent = lines;
        }

        function spawnNewPiece() {
            if (nextPiece) {
                currentPiece = nextPiece;
                currentPiece.x = Math.floor((COLS - currentPiece.shape[0].length) / 2);
                currentPiece.y = 0;
            } else {
                currentPiece = createPiece();
            }
            nextPiece = createPiece();

            // Prüfen ob Game Over (Kollision direkt beim Spawn)
            if (collision(currentPiece)) {
                gameOver = true;
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                setTimeout(() => {
                    alert('Game Over! Punkte: ' + score);
                }, 10);
                return false;
            }
            drawNext();
            return true;
        }

        function draw() {
            // Hintergrund
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Gitterlinien
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            for (let c = 0; c <= COLS; c++) {
                ctx.beginPath();
                ctx.moveTo(c * BLOCK_SIZE, 0);
                ctx.lineTo(c * BLOCK_SIZE, canvas.height);
                ctx.stroke();
            }
            for (let r = 0; r <= ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * BLOCK_SIZE);
                ctx.lineTo(canvas.width, r * BLOCK_SIZE);
                ctx.stroke();
            }

            // Board zeichnen
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c]) {
                        drawBlock(ctx, c, r, board[r][c]);
                    }
                }
            }

            // Aktuelles Piece zeichnen
            if (currentPiece && !gameOver) {
                const shape = currentPiece.shape;
                for (let r = 0; r < shape.length; r++) {
                    for (let c = 0; c < shape[r].length; c++) {
                        if (shape[r][c]) {
                            const x = (currentPiece.x + c) * BLOCK_SIZE;
                            const y = (currentPiece.y + r) * BLOCK_SIZE;
                            ctx.fillStyle = currentPiece.color;
                            ctx.fillRect(x, y, BLOCK_SIZE, BLOCK_SIZE);
                            ctx.strokeStyle = '#000';
                            ctx.strokeRect(x, y, BLOCK_SIZE, BLOCK_SIZE);
                        }
                    }
                }
            }

            // Game Over Overlay
            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, canvas.height / 2 - 40, canvas.width, 80);
                ctx.fillStyle = '#f00';
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 + 10);
            }
        }

        function drawBlock(context, col, row, color) {
            const x = col * BLOCK_SIZE;
            const y = row * BLOCK_SIZE;
            context.fillStyle = color;
            context.fillRect(x, y, BLOCK_SIZE, BLOCK_SIZE);
            context.strokeStyle = '#000';
            context.strokeRect(x, y, BLOCK_SIZE, BLOCK_SIZE);
        }

        function drawNext() {
            nextCtx.fillStyle = '#000';
            nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);

            if (!nextPiece) return;

            const shape = nextPiece.shape;
            const blockSize = 25;
            const offsetX = (nextCanvas.width - shape[0].length * blockSize) / 2;
            const offsetY = (nextCanvas.height - shape.length * blockSize) / 2;

            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        const x = offsetX + c * blockSize;
                        const y = offsetY + r * blockSize;
                        nextCtx.fillStyle = nextPiece.color;
                        nextCtx.fillRect(x, y, blockSize, blockSize);
                        nextCtx.strokeStyle = '#000';
                        nextCtx.strokeRect(x, y, blockSize, blockSize);
                    }
                }
            }
        }

        function movePiece(dx, dy) {
            if (gameOver || !currentPiece) return false;
            if (!collision(currentPiece, dx, dy)) {
                currentPiece.x += dx;
                currentPiece.y += dy;
                return true;
            }
            return false;
        }

        function rotatePiece() {
            if (gameOver || !currentPiece) return;
            const rotated = rotate(currentPiece.shape);
            // Wandkick einfach: versuche rotiert, dann links/rechts verschieben
            if (!collision(currentPiece, 0, 0, rotated)) {
                currentPiece.shape = rotated;
            } else if (!collision(currentPiece, -1, 0, rotated)) {
                currentPiece.shape = rotated;
                currentPiece.x -= 1;
            } else if (!collision(currentPiece, 1, 0, rotated)) {
                currentPiece.shape = rotated;
                currentPiece.x += 1;
            }
        }

        function dropPiece() {
            if (gameOver || !currentPiece) return;
            if (!movePiece(0, 1)) {
                // Kollision unten -> Piece fixieren
                merge(currentPiece);
                clearLines();
                updateInfo();
                if (!spawnNewPiece()) {
                    draw();
                    return;
                }
            }
            dropCounter = 0;
        }

        function hardDrop() {
            if (gameOver || !currentPiece) return;
            while (!collision(currentPiece, 0, 1)) {
                currentPiece.y++;
            }
            merge(currentPiece);
            clearLines();
            updateInfo();
            if (!spawnNewPiece()) {
                draw();
                return;
            }
            dropCounter = 0;
            draw();
        }

        function update(time = 0) {
            if (gameOver) {
                draw();
                return;
            }
            const deltaTime = time - lastTime;
            lastTime = time;

            dropCounter += deltaTime;
            if (dropCounter > dropInterval) {
                dropPiece();
                dropCounter = 0;
            }

            draw();
            animationId = requestAnimationFrame(update);
        }

        function resetGame() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            createBoard();
            score = 0;
            level = 1;
            lines = 0;
            dropInterval = 1000;
            dropCounter = 0;
            lastTime = 0;
            gameOver = false;
            nextPiece = null;
            currentPiece = null;
            updateInfo();

            spawnNewPiece(); // erzeugt current und next
            drawNext();

            lastTime = performance.now();
            animationId = requestAnimationFrame(update);
        }

        // Tastatursteuerung
        document.addEventListener('keydown', (e) => {
            if (gameOver) return;
            switch (e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    movePiece(-1, 0);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    movePiece(1, 0);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    movePiece(0, 1);
                    dropCounter = 0;
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    rotatePiece();
                    break;
                case ' ':
                    e.preventDefault();
                    hardDrop();
                    break;
            }
            draw();
        });

        document.getElementById('restartBtn').addEventListener('click', resetGame);

        // Spiel starten
        resetGame();
    </script>
</body>
  </html>
