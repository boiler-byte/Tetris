<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tetris</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0d0d12;
    color: #e8e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0d0d12 70%);
  }
  .game-wrap {
    display: flex;
    gap: 18px;
    align-items: flex-start;
    padding: 12px;
  }
  .board-container {
    position: relative;
    background: #12121c;
    border: 2px solid #2a2a40;
    border-radius: 10px;
    box-shadow: 0 0 40px rgba(90, 90, 200, 0.25), inset 0 0 30px rgba(0,0,0,0.6);
    padding: 6px;
  }
  canvas { display: block; border-radius: 6px; }
  .side {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 120px;
  }
  .panel {
    background: #12121c;
    border: 2px solid #2a2a40;
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  }
  .panel h2 {
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #7b7ba8;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .panel .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #b8b8ff;
    text-shadow: 0 0 12px rgba(120,120,255,0.5);
  }
  #nextCanvas { display: block; margin: 0 auto; }
  .controls {
    font-size: 11px;
    color: #6a6a90;
    line-height: 1.7;
  }
  .controls b { color: #9a9ad0; font-weight: 600; }
  .overlay {
    position: absolute;
    inset: 6px;
    border-radius: 6px;
    background: rgba(8, 8, 16, 0.88);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-size: 30px;
    letter-spacing: 6px;
    color: #b8b8ff;
    text-shadow: 0 0 20px rgba(120,120,255,0.7);
  }
  .overlay p { color: #8888b0; font-size: 13px; line-height: 1.6; }
  .overlay button {
    margin-top: 6px;
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #0d0d12;
    background: linear-gradient(180deg, #b8b8ff, #8a8af0);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(120,120,255,0.5);
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .overlay button:active { transform: scale(0.96); }
  @media (max-width: 620px) {
    .game-wrap { flex-direction: row; gap: 10px; padding: 6px; }
    .side { min-width: 84px; gap: 8px; }
    .panel { padding: 6px 8px; }
    .panel .value { font-size: 16px; }
    .panel h2 { font-size: 9px; letter-spacing: 1px; }
    .controls { display: none; }
    .overlay h1 { font-size: 24px; letter-spacing: 3px; }
  }
</style>
</head>
<body>
<div class="game-wrap">
  <div class="board-container">
    <canvas id="board"></canvas>
    <div id="overlay" class="overlay">
      <h1>TETRIS</h1>
      <p id="overlayText">Pfeiltasten oder Wischen<br>zum Spielen</p>
      <button id="startBtn">START</button>
    </div>
  </div>
  <div class="side">
    <div class="panel">
      <h2>Punkte</h2>
      <div class="value" id="score">0</div>
    </div>
    <div class="panel">
      <h2>Level</h2>
      <div class="value" id="level">1</div>
    </div>
    <div class="panel">
      <h2>Linien</h2>
      <div class="value" id="lines">0</div>
    </div>
    <div class="panel">
      <h2>Nächstes</h2>
      <canvas id="nextCanvas" width="96" height="96"></canvas>
    </div>
    <div class="panel controls">
      <b>← →</b> Bewegen<br>
      <b>↑ / X</b> Drehen<br>
      <b>↓</b> Schneller<br>
      <b>Leertaste</b> Fallen<br>
      <b>P</b> Pause
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
